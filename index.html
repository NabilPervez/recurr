<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import {
      Plus, Check, Calendar, Settings, Trash2, Download, Upload,
      Sun, Moon, X, Edit2, Clock, Home, RotateCcw, ChevronRight,
      Bell, AlertTriangle
    } from "lucide-react";

    // ─── Constants ────────────────────────────────────────────────────────────────
    const STORAGE_KEY = "recurr_tasks_v2";
    const PREFS_KEY   = "recurr_prefs_v2";
    const CATS_KEY    = "recurr_cats_v2";

    const DEFAULT_CATS = ["Auto","Home","Health","Family","Admin","Finance","Personal"];

    const SHORTCUTS = [
      { label:"Daily",    value:1,  unit:"days"   },
      { label:"Weekly",   value:1,  unit:"weeks"  },
      { label:"Bi-weekly",value:2,  unit:"weeks"  },
      { label:"Monthly",  value:1,  unit:"months" },
      { label:"6 Months", value:6,  unit:"months" },
      { label:"Yearly",   value:1,  unit:"years"  },
    ];

    const TIME_SLOTS = ["Morning","Afternoon","Evening","Night"];
    const TIME_EMOJI = { Morning:"🌅", Afternoon:"☀️", Evening:"🌇", Night:"🌙" };

    const CAT_PALETTE = {
      Auto:"#f97316", Home:"#06b6d4", Health:"#22c55e",
      Family:"#f43f5e", Admin:"#a78bfa", Finance:"#eab308",
      Personal:"#60a5fa",
    };
    const catColor = (cat) => CAT_PALETTE[cat] || "#94a3b8";

    const SAMPLE_TASKS = [
      { name:"Change oil",       category:"Auto",    frequency:{ value:6,  unit:"months" }, timeOfDay:"Morning",  daysFromNow:-2  },
      { name:"Dentist checkup",  category:"Health",  frequency:{ value:6,  unit:"months" }, timeOfDay:"Morning",  daysFromNow:0   },
      { name:"Order diapers",    category:"Family",  frequency:{ value:2,  unit:"weeks"  }, timeOfDay:"Afternoon",daysFromNow:0   },
      { name:"Pay credit card",  category:"Finance", frequency:{ value:1,  unit:"months" }, timeOfDay:null,       daysFromNow:3   },
      { name:"Water plants",     category:"Home",    frequency:{ value:1,  unit:"weeks"  }, timeOfDay:"Evening",  daysFromNow:0   },
      { name:"Review budget",    category:"Finance", frequency:{ value:1,  unit:"months" }, timeOfDay:null,       daysFromNow:10  },
      { name:"Car battery check",category:"Auto",    frequency:{ value:3,  unit:"years"  }, timeOfDay:null,       daysFromNow:45  },
      { name:"Rotate tires",     category:"Auto",    frequency:{ value:6,  unit:"months" }, timeOfDay:null,       daysFromNow:25  },
    ];

    // ─── Utils ────────────────────────────────────────────────────────────────────
    const uid = () => `t${Date.now()}${Math.random().toString(36).slice(2,6)}`;

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };

    const shiftDate = (dateStr, value, unit) => {
      const d = new Date(dateStr + "T12:00:00");
      if (unit==="days")   d.setDate(d.getDate() + value);
      if (unit==="weeks")  d.setDate(d.getDate() + value*7);
      if (unit==="months") d.setMonth(d.getMonth() + value);
      if (unit==="years")  d.setFullYear(d.getFullYear() + value);
      return d.toISOString().split("T")[0];
    };

    const dayDiff = (a, b) => Math.round(
      (new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000
    );

    const dateLabel = (dateStr) => {
      const t = todayStr();
      const diff = dayDiff(t, dateStr);
      if (diff < -1)  return `${Math.abs(diff)}d overdue`;
      if (diff === -1) return "Yesterday";
      if (diff === 0)  return "Today";
      if (diff === 1)  return "Tomorrow";
      if (diff <= 6)   return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{ weekday:"long" });
      return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{ month:"short", day:"numeric" });
    };

    const freqLabel = (f) => {
      if (!f) return "";
      const { value:v, unit:u } = f;
      if (v===1 && u==="days")   return "Daily";
      if (v===1 && u==="weeks")  return "Weekly";
      if (v===2 && u==="weeks")  return "Bi-weekly";
      if (v===1 && u==="months") return "Monthly";
      if (v===6 && u==="months") return "Every 6 mo";
      if (v===1 && u==="years")  return "Yearly";
      return `Every ${v} ${u}`;
    };

    // ─── Storage ──────────────────────────────────────────────────────────────────
    const load  = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
    const store = (key, val)      => localStorage.setItem(key, JSON.stringify(val));

    // ─── CSS ──────────────────────────────────────────────────────────────────────
    const STYLES = `
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Space+Mono:wght@400;700&display=swap');

    .rr {
      --bg:      #0f0e0b;
      --s1:      #181710;
      --s2:      #211f15;
      --s3:      #2c291b;
      --bd:      #35311f;
      --t1:      #ede5cc;
      --t2:      #8c8470;
      --t3:      #5a5442;
      --ac:      #c9a84c;
      --acbg:    rgba(201,168,76,0.14);
      --acglow:  rgba(201,168,76,0.32);
      --danger:  #d94f3d;
      --dangbg:  rgba(217,79,61,0.12);
      --ok:      #4db87e;
      --okbg:    rgba(77,184,126,0.12);
      --blue:    #5b9bd5;
      --bluebg:  rgba(91,155,213,0.12);

      --s3:  #e4dfc8;

      position:sticky; top:0; z-index:30;

    /* Content */

    .rr-sec {

    /* Task card */
    .rr-card {
      margin:0 12px 8px;
      background:var(--s1);
      border:1px solid var(--bd);

      padding:13px 15px; border-radius:12px;

      border:1.5px solid var(--ac); background:var(--acbg);

      font-size:14px; font-weight:500; cursor:pointer; transition:all 0.15s;
    }
    .rr-demo-btn:hover { background:var(--ac); color:#000; }
    `;

    // ─── TaskCard ─────────────────────────────────────────────────────────────────
    function TaskCard({ task, showDate=false, onComplete, onDelay, onEdit, onDelete }) {
      const [done, setDone] = useState(false);
      const t = todayStr();
      const isOverdue = task.nextDueDate < t;
      const isToday   = task.nextDueDate === t;

      const handleComplete = () => {
        setDone(true);
        setTimeout(() => { onComplete(task.id); setDone(false); }, 350);
      };

      const cc = catColor(task.category);
      return (
        <div
          className={`rr-card ${isOverdue && showDate ? "overdue" : ""} ${done ? "completing" : ""}`}
          style={{ "--cat-clr": cc }}
        >
          <button className={`rr-check ${done ? "done" : ""}`} onClick={handleComplete} aria-label="Complete">
            <Check size={13} strokeWidth={3} />
          </button>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="rr-tname">{task.name}</div>
            <div className="rr-tmeta">
              {task.category && (
                <span className="rr-badge" style={{ background:cc+"20", color:cc, border:`1px solid ${cc}35` }}>
                  {task.category}
                </span>
              )}
              <span className="rr-freq">{freqLabel(task.frequency)}</span>
              {task.timeOfDay && <span className="rr-freq">{TIME_EMOJI[task.timeOfDay]} {task.timeOfDay}</span>}
              {showDate && (
                <span className={`rr-datechip ${isOverdue?"overdue":isToday?"today":""}`}>
                  {dateLabel(task.nextDueDate)}
                </span>
              )}
            </div>
          </div>
          <div className="rr-acts">
            <button className="rr-act delay" onClick={() => onDelay(task.id)} title="Delay" aria-label="Delay"><Clock size={12} /></button>
            <button className="rr-act edit"  onClick={() => onEdit(task)}     title="Edit"  aria-label="Edit"><Edit2 size={12} /></button>
            <button className="rr-act del"   onClick={() => onDelete(task.id)} title="Delete" aria-label="Delete"><Trash2 size={12} /></button>
          </div>
        </div>
      );
    }

    // ─── TodayView ────────────────────────────────────────────────────────────────
    function TodayView({ groups, total, onComplete, onDelay, onEdit, onDelete, onLoadSamples }) {
      if (total === 0) return (
        <div className="rr-empty">
          <div className="rr-empty-ico">✅</div>
          <div className="rr-empty-ttl">You're all caught up!</div>
          <div className="rr-empty-sub">No tasks due today. Add a recurring task to start tracking life maintenance.</div>
          <button className="rr-demo-btn" onClick={onLoadSamples}>Load sample tasks</button>
        </div>
      );
      return (
        <div>
          {groups.map(({ slot, tasks }) => (
            <div key={slot}>
              <div className="rr-sec">{TIME_EMOJI[slot] || "⏰"}&nbsp;&nbsp;{slot}</div>
              {tasks.map(task => (
                <TaskCard key={task.id} task={task}
                  onComplete={onComplete} onDelay={onDelay} onEdit={onEdit} onDelete={onDelete} />
              ))}
            </div>
          ))}
        </div>
      );
    }

    // ─── UpcomingView ─────────────────────────────────────────────────────────────
    function UpcomingView({ groups, onComplete, onDelay, onEdit, onDelete }) {
      if (groups.length === 0) return (
        <div className="rr-empty">
          <div className="rr-empty-ico">📅</div>
          <div className="rr-empty-ttl">Nothing ahead</div>
          <div className="rr-empty-sub">No upcoming tasks. Tasks will appear here after you add them.</div>
        </div>
      );
      return (
        <div>
          {groups.map(({ label, tasks }) => (
            <div key={label}>
              <div className="rr-sec">{label}</div>
              {tasks.map(task => (
                <TaskCard key={task.id} task={task} showDate
                  onComplete={onComplete} onDelay={onDelay} onEdit={onEdit} onDelete={onDelete} />
              ))}
            </div>
          ))}
        </div>
      );
    }

    // ─── SettingsView ─────────────────────────────────────────────────────────────
    function SettingsView({ prefs, setPref, cats, setCats, onExport, onImport, taskCount, onClear }) {
      const fileRef = useRef();
      const [newCat, setNewCat] = useState("");

      const addCat = () => {
        const v = newCat.trim();
        if (v && !cats.includes(v)) { setCats(p => [...p, v]); }
        setNewCat("");
      };

      return (
        <div style={{ paddingTop:6 }}>
          <div className="rr-sec">🎨&nbsp;&nbsp;Appearance</div>
          <div className="rr-sgrp">
            <div className="rr-srow">
              <div><div className="rr-slbl">Dark Mode</div><div className="rr-ssub">Warm dark / light theme</div></div>
              <button className={`rr-toggle ${prefs.theme==="dark"?"on":""}`}
                onClick={() => setPref("theme", prefs.theme==="dark"?"light":"dark")} aria-label="Toggle theme">
                <div className="rr-tknob" />
              </button>
            </div>
          </div>

          <div className="rr-sec">📦&nbsp;&nbsp;Data</div>
          <div className="rr-sgrp">
            <div className="rr-srow">
              <div>
                <div className="rr-slbl">Local storage</div>
                <div className="rr-ssub">All data lives on your device only</div>
              </div>
              <span style={{ fontFamily:"Space Mono,monospace", fontSize:18, color:"var(--ac)", fontWeight:700 }}>
                {taskCount}
              </span>
            </div>
            <div className="rr-srow">
              <div><div className="rr-slbl">Export backup</div><div className="rr-ssub">Download as JSON</div></div>
              <button className="rr-sbtn" onClick={onExport}><Download size={13} /> Export</button>
            </div>
            <div className="rr-srow">
              <div><div className="rr-slbl">Import backup</div><div className="rr-ssub">Restore from JSON</div></div>
              <button className="rr-sbtn" onClick={() => fileRef.current?.click()}><Upload size={13} /> Import</button>
              <input ref={fileRef} type="file" accept=".json" style={{ display:"none" }}
                onChange={e => { if (e.target.files[0]) onImport(e.target.files[0]); e.target.value=""; }} />
            </div>
          </div>

          <div className="rr-sec">🗂&nbsp;&nbsp;Categories</div>
          <div className="rr-sgrp">
            <div style={{ padding:"12px 15px" }}>
              <div style={{ display:"flex", flexWrap:"wrap", gap:8, marginBottom:10 }}>
                {cats.map(cat => {
                  const cc = catColor(cat);
                  const isDefault = DEFAULT_CATS.includes(cat);
                  return (
                    <span key={cat} style={{
                      display:"flex", alignItems:"center", gap:4,
                      padding:"4px 10px", borderRadius:20,
                      background:cc+"20", border:`1px solid ${cc}35`, color:cc,
                      fontSize:12, fontWeight:500,
                    }}>
                      {cat}
                      {!isDefault && (
                        <button onClick={() => setCats(p => p.filter(c=>c!==cat))}
                          style={{ background:"none", border:"none", cursor:"pointer", color:"inherit", padding:0, display:"flex", opacity:0.7 }}>
                          <X size={10} />
                        </button>
                      )}
                    </span>
                  );
                })}
              </div>
              <div style={{ display:"flex", gap:8 }}>
                <input className="rr-inp" value={newCat} onChange={e=>setNewCat(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addCat()}
                  placeholder="Add custom category…" style={{ flex:1, fontSize:13, padding:"9px 12px" }} />
                <button onClick={addCat} style={{
                  padding:"9px 13px", borderRadius:10, border:"1px solid var(--bd)",
                  background:"var(--s2)", color:"var(--t1)", cursor:"pointer", fontSize:13, fontWeight:500
                }}>Add</button>
              </div>
            </div>
          </div>

          <div className="rr-sec">⚠️&nbsp;&nbsp;Danger Zone</div>
          <div className="rr-sgrp" style={{ marginBottom:32 }}>
            <div className="rr-srow">
              <div>
                <div className="rr-slbl" style={{ color:"var(--danger)" }}>Clear all data</div>
                <div className="rr-ssub">Permanently delete all tasks</div>
              </div>
              <button className="rr-sbtn danger" onClick={onClear}><Trash2 size={13} /> Clear</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── DelayModal ───────────────────────────────────────────────────────────────
    function DelayModal({ taskName, onDelay, onClose }) {
      const opts = [
        { label:"+1 Day",   days:1  },
        { label:"+3 Days",  days:3  },
        { label:"+1 Week",  days:7  },
        { label:"+2 Weeks", days:14 },
      ];
      const t = todayStr();
      return (
        <div className="rr-overlay" onClick={onClose}>
          <div className="rr-sheet" onClick={e=>e.stopPropagation()}>
            <div className="rr-handle" />
            <div className="rr-shdr">
              <span className="rr-sttl">Delay Task</span>
              <button className="rr-hbtn" onClick={onClose} aria-label="Close"><X size={17} /></button>
            </div>
            <div style={{ padding:"0 16px 8px" }}>
              {taskName && <p style={{ fontSize:14, fontWeight:500, color:"var(--t1)", marginBottom:6 }}>"{taskName}"</p>}
              <p style={{ fontSize:13, color:"var(--t2)", lineHeight:1.55, marginBottom:14 }}>
                Delays this occurrence only. The recurrence base stays the same, so the <em>next</em> due date is unaffected.
              </p>
              <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
                {opts.map(({ label, days }) => (
                  <button key={days} className="rr-dopt" onClick={() => onDelay(days)}>
                    <Clock size={16} />
                    <span>{label}</span>
                    <span style={{ marginLeft:"auto", fontSize:11, color:"var(--t3)", fontFamily:"Space Mono,monospace" }}>
                      → {dateLabel(shiftDate(t, days, "days"))}
                    </span>
                  </button>
                ))}
              </div>
            </div>
            <div className="rr-row">
              <button className="rr-btn-s" onClick={onClose}>Cancel</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── TaskModal (Add / Edit) ───────────────────────────────────────────────────
    function TaskModal({ task, cats, setCats, onSave, onDelete, onClose }) {
      const isEdit = !!task;
      const initFreq = task?.frequency;
      const initIsCustom = initFreq ? !SHORTCUTS.some(s=>s.value===initFreq.value&&s.unit===initFreq.unit) : false;

      const [name,       setName]       = useState(task?.name || "");
      const [category,   setCategory]   = useState(task?.category || cats[0] || "");
      const [shortcut,   setShortcut]   = useState(initFreq || SHORTCUTS[2]);
      const [useCustom,  setUseCustom]  = useState(initIsCustom);
      const [custVal,    setCustVal]    = useState(initFreq?.value || 2);
      const [custUnit,   setCustUnit]   = useState(initFreq?.unit  || "weeks");
      const [timeOfDay,  setTimeOfDay]  = useState(task?.timeOfDay || null);
      const [startDate,  setStartDate]  = useState(task?.nextDueDate || todayStr());
      const [newCat,     setNewCat]     = useState("");
      const [err,        setErr]        = useState("");

      const freq = useCustom ? { value: Number(custVal), unit: custUnit } : shortcut;

      const handleSave = () => {
        if (!name.trim()) { setErr("Task name is required."); return; }
        onSave({ name: name.trim(), category, frequency: freq, timeOfDay, startDate });
      };

      const addNewCat = () => {
        const v = newCat.trim();
        if (!v) return;
        if (!cats.includes(v)) setCats(p => [...p, v]);
        setCategory(v);
        setNewCat("");
      };

      return (
        <div className="rr-overlay" onClick={onClose}>
          <div className="rr-sheet" onClick={e=>e.stopPropagation()}>
            <div className="rr-handle" />
            <div className="rr-shdr">
              <span className="rr-sttl">{isEdit ? "Edit Task" : "New Task"}</span>
              <button className="rr-hbtn" onClick={onClose} aria-label="Close"><X size={17} /></button>
            </div>

            {/* Name */}
            <div className="rr-fg">
              <label className="rr-lbl">Task Name</label>
              <input className="rr-inp" value={name} autoFocus
                onChange={e=>{ setName(e.target.value); setErr(""); }}
                onKeyDown={e=>e.key==="Enter"&&handleSave()}
                placeholder="e.g. Change oil, Order diapers, Call mom…" />
              {err && <p style={{ color:"var(--danger)", fontSize:12, marginTop:5 }}>{err}</p>}
            </div>

            {/* Category */}
            <div className="rr-fg">
              <label className="rr-lbl">Category</label>
              <select className="rr-sel" value={category} onChange={e=>setCategory(e.target.value)}>
                {cats.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <div style={{ display:"flex", gap:8, marginTop:8 }}>
                <input className="rr-inp" value={newCat} onChange={e=>setNewCat(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&addNewCat()}
                  placeholder="New category…" style={{ flex:1, fontSize:13, padding:"9px 12px" }} />
                <button onClick={addNewCat} style={{
                  padding:"9px 13px", borderRadius:10, border:"1px solid var(--bd)",
                  background:"var(--s2)", color:"var(--t1)", cursor:"pointer", fontSize:13, whiteSpace:"nowrap"
                }}>+ Add</button>
              </div>
            </div>

            {/* Frequency */}
            <div className="rr-fg">
              <label className="rr-lbl">Repeat Every</label>
              <div className="rr-chips" style={{ marginBottom:10 }}>
                {SHORTCUTS.map(s => (
                  <button key={s.label}
                    className={`rr-chip ${!useCustom && shortcut.value===s.value && shortcut.unit===s.unit ? "on":""}`}
                    onClick={() => { setShortcut(s); setUseCustom(false); }}>
                    {s.label}
                  </button>
                ))}
                <button className={`rr-chip ${useCustom?"on":""}`} onClick={() => setUseCustom(true)}>
                  Custom…
                </button>
              </div>
              {useCustom && (
                <div style={{ display:"flex", gap:8 }}>
                  <input type="number" min={1} max={999} className="rr-inp"
                    value={custVal} onChange={e=>setCustVal(e.target.value)}
                    style={{ width:78, flex:"0 0 78px" }} />
                  <select className="rr-sel" value={custUnit} onChange={e=>setCustUnit(e.target.value)}>
                    <option value="days">Days</option>
                    <option value="weeks">Weeks</option>
                    <option value="months">Months</option>
                    <option value="years">Years</option>
                  </select>
                </div>
              )}
            </div>

            {/* Time of day */}
            <div className="rr-fg">
              <label className="rr-lbl">Time of Day <span style={{ fontWeight:400, textTransform:"none", letterSpacing:0, color:"var(--t3)", fontFamily:"DM Sans" }}>(optional)</span></label>
              <div className="rr-chips">
                {TIME_SLOTS.map(slot => (
                  <button key={slot}
                    className={`rr-chip ${timeOfDay===slot?"on":""}`}
                    onClick={() => setTimeOfDay(timeOfDay===slot ? null : slot)}>
                    {TIME_EMOJI[slot]} {slot}
                  </button>
                ))}
              </div>
            </div>

            {/* Start date */}
            <div className="rr-fg">
              <label className="rr-lbl">First Due Date</label>
              <input type="date" className="rr-inp" value={startDate}
                onChange={e=>setStartDate(e.target.value)}
                style={{ colorScheme: "dark" }} />
            </div>

            {/* Buttons */}
            <div className="rr-row">
              {isEdit && onDelete && (
                <button className="rr-btn-s danger" onClick={onDelete}
                  style={{ flex:"0 0 auto", padding:"13px 14px" }}>
                  <Trash2 size={15} />
                </button>
              )}
              <button className="rr-btn-s" onClick={onClose}>Cancel</button>
              <button className="rr-btn-p" onClick={handleSave}>{isEdit ? "Save Changes" : "Add Task"}</button>
            </div>
          </div>
        </div>
      );
    }

    // ─── Root Application ─────────────────────────────────────────────────────────
    function App() {
      const [tasks,  setTasks]  = useState(() => load(STORAGE_KEY, []));
      const [prefs,  setPrefs]  = useState(() => ({ theme:"dark", ...load(PREFS_KEY, {}) }));
      const [cats,   setCats]   = useState(() => load(CATS_KEY, DEFAULT_CATS));
      const [view,   setView]   = useState("today");
      const [modal,  setModal]  = useState(null);   // null | {type:'add'} | {type:'edit', task}
      const [dlyId,  setDlyId]  = useState(null);   // task id for delay modal

      useEffect(() => { store(STORAGE_KEY, tasks); }, [tasks]);
      useEffect(() => { store(PREFS_KEY,   prefs); }, [prefs]);
      useEffect(() => { store(CATS_KEY,    cats);  }, [cats]);

      const setPref = (k,v) => setPrefs(p=>({...p,[k]:v}));
      const dark = prefs.theme === "dark";

      // ── Task Operations ──
      const addTask = useCallback((data) => {
        setTasks(p => [...p, {
          id: uid(), name:data.name, category:data.category,
          frequency:data.frequency, timeOfDay:data.timeOfDay || null,
          nextDueDate: data.startDate || todayStr(),
          baseDueDate: data.startDate || todayStr(),
          createdAt: new Date().toISOString(), lastCompleted: null,
        }]);
      }, []);

      const updateTask = useCallback((id, data) => {
        setTasks(p => p.map(t => {
          if (t.id !== id) return t;
          return {
            ...t, name:data.name, category:data.category,
            frequency:data.frequency, timeOfDay:data.timeOfDay || null,
            nextDueDate: data.startDate, baseDueDate: data.startDate,
          };
        }));
      }, []);

      const deleteTask  = useCallback((id) => setTasks(p=>p.filter(t=>t.id!==id)), []);

      const completeTask = useCallback((id) => {
        setTasks(p => p.map(t => {
          if (t.id !== id) return t;
          const newBase = shiftDate(t.baseDueDate, t.frequency.value, t.frequency.unit);
          return { ...t, baseDueDate:newBase, nextDueDate:newBase, lastCompleted:new Date().toISOString() };
        }));
      }, []);

      const delayTask = useCallback((id, days) => {
        setTasks(p => p.map(t =>
          t.id!==id ? t : { ...t, nextDueDate:shiftDate(t.nextDueDate, days, "days") }
        ));
      }, []);

      const loadSamples = () => {
        const t = todayStr();
        const samples = SAMPLE_TASKS.map(s => ({
          id: uid(),
          name: s.name, category: s.category,
          frequency: s.frequency, timeOfDay: s.timeOfDay,
          nextDueDate: shiftDate(t, s.daysFromNow, "days"),
          baseDueDate: shiftDate(t, s.daysFromNow, "days"),
          createdAt: new Date().toISOString(), lastCompleted: null,
        }));
        setTasks(samples);
      };

      // ── Derived ──
      const t = todayStr();
      const todayTasks    = tasks.filter(task => task.nextDueDate <= t);
      const upcomingTasks = tasks.filter(task => task.nextDueDate >  t)
        .sort((a,b) => a.nextDueDate.localeCompare(b.nextDueDate));

      const todayByTime = [...TIME_SLOTS, "Anytime"].map(slot => ({
        slot,
        tasks: slot==="Anytime"
          ? todayTasks.filter(task => !task.timeOfDay)
          : todayTasks.filter(task => task.timeOfDay===slot),
      })).filter(g => g.tasks.length > 0);

      const d1=shiftDate(t,1,"days"), d7=shiftDate(t,7,"days"),
            d14=shiftDate(t,14,"days"), d30=shiftDate(t,30,"days");

      const upcomingGroups = [
        { label:"Tomorrow",   tasks: upcomingTasks.filter(x => x.nextDueDate===d1) },
        { label:"This Week",  tasks: upcomingTasks.filter(x => x.nextDueDate>d1  && x.nextDueDate<=d7)  },
        { label:"Next Week",  tasks: upcomingTasks.filter(x => x.nextDueDate>d7  && x.nextDueDate<=d14) },
        { label:"This Month", tasks: upcomingTasks.filter(x => x.nextDueDate>d14 && x.nextDueDate<=d30) },
        { label:"Future",     tasks: upcomingTasks.filter(x => x.nextDueDate>d30) },
      ].filter(g => g.tasks.length > 0);

      // ── Import / Export ──
      const exportData = () => {
        const blob = new Blob(
          [JSON.stringify({ tasks, categories:cats, preferences:prefs, exportedAt:new Date().toISOString() }, null, 2)],
          { type:"application/json" }
        );
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url; a.download=`recurr-backup-${t}.json`; a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (window.confirm("Replace current data with this backup?")) {
              if (data.tasks)       setTasks(data.tasks);
              if (data.categories)  setCats(data.categories);
              if (data.preferences) setPrefs(p=>({...p,...data.preferences}));
            }
          } catch { alert("Invalid backup file."); }
        };
        reader.readAsText(file);
      };

      const clearData = () => {
        if (window.confirm("Delete ALL tasks? This cannot be undone.")) {
          setTasks([]); setCats(DEFAULT_CATS);
        }
      };

      // ── Header meta ──
      const now = new Date();
      const dateLine = now.toLocaleDateString("en-US",{ weekday:"long", month:"long", day:"numeric" });
      const viewSub = {
        today:    dateLine,
        upcoming: `${upcomingTasks.length} task${upcomingTasks.length!==1?"s":""} ahead`,
        settings: "Preferences & data",
      };

      const delayTask_ = tasks.find(t=>t.id===dlyId);

      return (
        <div className={`rr ${dark ? "" : "light"}`}>
          <style>{STYLES}</style>

          {/* Header */}
          <div className="rr-header">
            <div>
              <div className="rr-logo">
                <div className="rr-logo-dot" />
                {view==="today" ? "Recurr" : view==="upcoming" ? "Upcoming" : "Settings"}
              </div>
              <div className="rr-header-sub">{viewSub[view]}</div>
            </div>
            <button className="rr-hbtn" onClick={()=>setPref("theme",dark?"light":"dark")} aria-label="Toggle theme">
              {dark ? <Sun size={16}/> : <Moon size={16}/>}
            </button>
          </div>

          {/* Main content */}
          <div className="rr-content">
            {view==="today" && (
              <TodayView groups={todayByTime} total={todayTasks.length}
                onComplete={completeTask} onDelay={setDlyId} onEdit={task=>setModal({type:"edit",task})}
                onDelete={deleteTask} onLoadSamples={loadSamples} />
            )}
            {view==="upcoming" && (
              <UpcomingView groups={upcomingGroups}
                onComplete={completeTask} onDelay={setDlyId} onEdit={task=>setModal({type:"edit",task})}
                onDelete={deleteTask} />
            )}
            {view==="settings" && (
              <SettingsView prefs={prefs} setPref={setPref} cats={cats} setCats={setCats}
                onExport={exportData} onImport={importData} taskCount={tasks.length} onClear={clearData} />
            )}
          </div>

          {/* FAB */}
          {view!=="settings" && (
            <button className="rr-fab" onClick={()=>setModal({type:"add"})} aria-label="Add task">
              <Plus size={22} color="#000" strokeWidth={2.5}/>
            </button>
          )}

          {/* Bottom Nav */}
          <nav className="rr-nav" role="navigation" aria-label="Main navigation">
            {[
              { id:"today",    icon:<Home size={20}/>,     label:"Today"    },
              { id:"upcoming", icon:<Calendar size={20}/>, label:"Upcoming" },
              { id:"settings", icon:<Settings size={20}/>, label:"Settings" },
            ].map(tab => (
              <button key={tab.id} className={`rr-ntab ${view===tab.id?"on":""}`}
                onClick={()=>setView(tab.id)} style={{ position:"relative" }}>
                {tab.icon}
                {tab.id==="today" && todayTasks.length>0 && (
                  <span className="rr-nbadge">{todayTasks.length>9?"9+":todayTasks.length}</span>
                )}
                {tab.label}
              </button>
            ))}
          </nav>

          {/* Task Modal */}
          {(modal?.type==="add" || modal?.type==="edit") && (
            <TaskModal
              task={modal.type==="edit" ? modal.task : null}
              cats={cats} setCats={setCats}
              onSave={data => {
                if (modal.type==="edit") updateTask(modal.task.id, data);
                else addTask(data);
                setModal(null);
              }}
              onDelete={modal.type==="edit" ? ()=>{ deleteTask(modal.task.id); setModal(null); } : null}
              onClose={()=>setModal(null)}
            />
          )}

          {/* Delay Modal */}
          {dlyId && (
            <DelayModal taskName={delayTask_?.name}
              onDelay={days=>{ delayTask(dlyId, days); setDlyId(null); }}
              onClose={()=>setDlyId(null)} />
          )}
        </div>
      );
    }

    // Mount the Application
    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
