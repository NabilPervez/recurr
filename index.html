<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0e0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Recurr</title>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "@formkit/auto-animate": "https://esm.sh/@formkit/auto-animate@0.8.1",
        "canvas-confetti": "https://esm.sh/canvas-confetti@1.9.2"
      }
    }
  </script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0e0b;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect, useRef, useCallback } from "react";
    import { createRoot } from "react-dom/client";
    import {
      Plus, Check, Calendar, Settings, Trash2, Download, Upload,
      Sun, Moon, X, Edit2, Clock, Home, History, Bell, Link
    } from "lucide-react";
    import autoAnimate from "@formkit/auto-animate";
    import confetti from "canvas-confetti";

    // ─── Constants ────────────────────────────────────────────────────────────────
    const STORAGE_KEY = "recurr_tasks_v3";
    const PREFS_KEY   = "recurr_prefs_v3";
    const CATS_KEY    = "recurr_cats_v3";

    const DEFAULT_CATS = ["Auto","Home","Health","Family","Admin","Finance","Personal"];

    const SHORTCUTS = [
      { label:"Daily",    value:1,  unit:"days"   },
      { label:"Weekly",   value:1,  unit:"weeks"  },
      { label:"Bi-weekly",value:2,  unit:"weeks"  },
      { label:"Monthly",  value:1,  unit:"months" },
      { label:"6 Months", value:6,  unit:"months" },
      { label:"Yearly",   value:1,  unit:"years"  },
    ];

    const TIME_SLOTS = ["Morning","Afternoon","Evening","Night"];
    const TIME_EMOJI = { Morning:"🌅", Afternoon:"☀️", Evening:"🌇", Night:"🌙" };

    const CAT_PALETTE = {
      Auto:"#f97316", Home:"#06b6d4", Health:"#22c55e",
      Family:"#f43f5e", Admin:"#a78bfa", Finance:"#eab308",
      Personal:"#60a5fa",
    };
    const catColor = (cat) => CAT_PALETTE[cat] || "#94a3b8";

    // ─── Utils ────────────────────────────────────────────────────────────────────
    const uid = () => `t${Date.now()}${Math.random().toString(36).slice(2,6)}`;

    const todayStr = () => {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    };

    const shiftDate = (dateStr, value, unit) => {
      const d = new Date(dateStr + "T12:00:00");
      if (unit==="days")   d.setDate(d.getDate() + value);
      if (unit==="weeks")  d.setDate(d.getDate() + value*7);
      if (unit==="months") d.setMonth(d.getMonth() + value);
      if (unit==="years")  d.setFullYear(d.getFullYear() + value);
      return d.toISOString().split("T")[0];
    };

    const dayDiff = (a, b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00")) / 86400000);

    const dateLabel = (dateStr) => {
      const t = todayStr();
      const diff = dayDiff(t, dateStr);
      if (diff < -1)  return `${Math.abs(diff)}d overdue`;
      if (diff === -1) return "Yesterday";
      if (diff === 0)  return "Today";
      if (diff === 1)  return "Tomorrow";
      if (diff <= 6)   return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{ weekday:"long" });
      return new Date(dateStr+"T12:00:00").toLocaleDateString("en-US",{ month:"short", day:"numeric" });
    };

    const freqLabel = (f) => {
      if (!f) return "";
      const { value:v, unit:u } = f;
      if (v===1 && u==="days")   return "Daily";
      if (v===1 && u==="weeks")  return "Weekly";
      if (v===2 && u==="weeks")  return "Bi-weekly";
      if (v===1 && u==="months") return "Monthly";
      if (v===6 && u==="months") return "Every 6 mo";
      if (v===1 && u==="years")  return "Yearly";
      return `Every ${v} ${u}`;
    };

    // ─── Storage ──────────────────────────────────────────────────────────────────
    const load  = (key, fallback) => { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch { return fallback; } };
    const store = (key, val)      => localStorage.setItem(key, JSON.stringify(val));

    // ─── CSS ──────────────────────────────────────────────────────────────────────
    const STYLES = `
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=Space+Mono:wght@400;700&display=swap');

    .rr {
      --bg:      #0f0e0b;
      --s1:      #181710;
      --s2:      #211f15;
      --s3:      #2c291b;
      --bd:      #35311f;
      --t1:      #ede5cc;
      --t2:      #8c8470;
      --t3:      #5a5442;
      --ac:      #c9a84c;
      --acbg:    rgba(201,168,76,0.14);
      --danger:  #d94f3d;
      --dangbg:  rgba(217,79,61,0.12);
      --ok:      #4db87e;
      --okbg:    rgba(77,184,126,0.12);
      --blue:    #5b9bd5;
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--t1);
      min-height: 100vh; display: flex; flex-direction: column;
      max-width: 480px; margin: 0 auto; position: relative;
    }
    .rr.light {
      --bg:  #f5f2e8; --s1: #ffffff; --s2: #eeeadb; --s3: #e4dfc8;
      --bd:  #cdc7b0; --t1: #1a1810; --t2: #6b6452; --t3: #9b937e;
    }
    *{box-sizing:border-box;margin:0;padding:0;}

    /* Header & Nav */
    .rr-header { position:sticky; top:0; z-index:30; background:rgba(var(--bg), 0.9); backdrop-filter:blur(8px); border-bottom:1px solid var(--bd); padding:13px 16px 12px; display:flex; align-items:center; justify-content:space-between; }
    .rr-logo { font-family:'Syne',sans-serif; font-size:24px; font-weight:800; color:var(--ac); letter-spacing:-1px; display:flex; align-items:center; gap:6px; }
    .rr-header-sub { font-family:'Space Mono',monospace; font-size:10px; color:var(--t3); margin-top:1px; }
    .rr-content { flex:1; overflow-y:auto; padding-bottom:130px; }
    .rr-sec { padding:18px 16px 8px; font-family:'Space Mono',monospace; font-size:9px; letter-spacing:2.5px; text-transform:uppercase; color:var(--t3); display:flex; align-items:center; gap:10px; }
    .rr-sec::after { content:''; flex:1; height:1px; background:var(--bd); }
    
    /* Swipe Wrapper */
    .rr-card-wrapper { position:relative; margin:0 12px 8px; border-radius:15px; background:var(--s3); overflow:hidden; }
    .rr-swipe-actions { position:absolute; inset:0; display:flex; align-items:center; justify-content:space-between; padding:0 20px; font-size:14px; font-weight:bold; }
    .rr-swipe-left { color:var(--ok); }
    .rr-swipe-right { color:var(--danger); }

    /* Task card */
    .rr-card { background:var(--s1); border:1px solid var(--bd); border-radius:15px; padding:13px 13px 13px 16px; display:flex; align-items:flex-start; gap:11px; position:relative; z-index:2; touch-action: pan-y; }
    .rr-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; border-radius:15px 0 0 15px; background:var(--cat-clr, var(--ac)); }
    .rr-card.completed { opacity:0.6; }
    
    .rr-check { width:28px; height:28px; border-radius:50%; border:2px solid var(--bd); background:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:transparent; transition:all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .rr-check.done { border-color:var(--ok); background:var(--ok); color:#fff; transform:scale(1.1); }
    .rr-tname { font-size:15px; font-weight:500; color:var(--t1); line-height:1.3; flex:1; }
    .rr-tmeta { display:flex; align-items:center; gap:5px; margin-top:5px; flex-wrap:wrap; }
    .rr-badge { padding:2px 8px; border-radius:8px; font-size:11px; font-weight:500; }
    .rr-streak { display:flex; align-items:center; gap:3px; font-size:11px; color:#f97316; font-weight:700; background:rgba(249,115,22,0.15); padding:2px 6px; border-radius:6px; }

    /* Forms & UI */
    .rr-nav { position:fixed; bottom:0; width:100%; max-width:480px; background:var(--bg); border-top:1px solid var(--bd); display:flex; z-index:30; padding:8px 0 max(env(safe-area-inset-bottom), 6px); }
    .rr-ntab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:5px 4px; border:none; background:none; cursor:pointer; color:var(--t3); font-size:10px; transition:color 0.15s; }
    .rr-ntab.on { color:var(--ac); }
    .rr-fab { position:fixed; bottom:max(calc(env(safe-area-inset-bottom) + 70px), 76px); right:max(calc(50% - 240px + 16px), 16px); width:52px; height:52px; border-radius:15px; background:var(--ac); border:none; display:flex; align-items:center; justify-content:center; z-index:29; box-shadow:0 4px 22px var(--acglow); }
    .rr-sheet { position:fixed; bottom:0; width:100%; max-width:480px; background:var(--s1); border-radius:22px 22px 0 0; max-height:91vh; overflow-y:auto; z-index:51; padding-bottom:max(env(safe-area-inset-bottom), 16px); animation:sheetUp 0.3s cubic-bezier(0.34,1.4,0.64,1); }
    @keyframes sheetUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
    
    .stagger-item { animation: fadeSlide 0.4s ease forwards; opacity: 0; }
    @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    `;

    // ─── TaskCard Component ───────────────────────────────────────────────────────
    function TaskCard({ task, showDate, isCompletedToday, onComplete, onEdit, onDelete, index }) {
      const [done, setDone] = useState(isCompletedToday);
      const [swipeX, setSwipeX] = useState(0);
      const touchStart = useRef({ x: 0, y: 0 });
      const cardRef = useRef(null);

      const isOverdue = task.nextDueDate < todayStr();
      const cc = catColor(task.category);

      const triggerComplete = () => {
        setDone(true);
        confetti({ particleCount: 60, spread: 60, origin: { y: 0.7 }, colors: [cc, '#4db87e', '#ffffff'] });
        setTimeout(() => onComplete(task.id), 400);
      };

      const handleTouchStart = (e) => {
        touchStart.current = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      };

      const handleTouchMove = (e) => {
        if (isCompletedToday) return;
        const dx = e.touches[0].clientX - touchStart.current.x;
        const dy = e.touches[0].clientY - touchStart.current.y;
        if (Math.abs(dx) > Math.abs(dy) + 5) { // Prioritize horizontal
          e.preventDefault(); // Stop vertical scroll
          setSwipeX(Math.max(-100, Math.min(100, dx)));
        }
      };

      const handleTouchEnd = () => {
        if (swipeX > 75) triggerComplete();
        else if (swipeX < -75) onDelete(task.id);
        setSwipeX(0);
      };

      return (
        <div className={`rr-card-wrapper stagger-item`} style={{ animationDelay: `${index * 0.05}s` }}>
          <div className="rr-swipe-actions">
            <span className="rr-swipe-left"><Check size={18}/> Complete</span>
            <span className="rr-swipe-right">Delete <Trash2 size={18}/></span>
          </div>
          <div 
            ref={cardRef}
            className={`rr-card ${done ? 'completed' : ''}`} 
            style={{ "--cat-clr": cc, transform: `translateX(${swipeX}px)`, transition: swipeX === 0 ? 'transform 0.2s ease-out' : 'none' }}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            onClick={() => !done && onEdit(task)}
          >
            <button className={`rr-check ${done ? "done" : ""}`} onClick={(e) => { e.stopPropagation(); !done && triggerComplete(); }}>
              <Check size={14} strokeWidth={3} />
            </button>
            <div style={{ flex:1, minWidth:0, marginLeft:10 }}>
              <div className="rr-tname" style={{ textDecoration: done ? 'line-through' : 'none', opacity: done ? 0.6 : 1 }}>
                {task.name}
              </div>
              <div className="rr-tmeta">
                <span className="rr-badge" style={{ background:cc+"20", color:cc }}>{task.category}</span>
                <span style={{ fontSize:11, color:"var(--t3)", fontFamily:"Space Mono" }}>{freqLabel(task.frequency)}</span>
                {task.streak > 0 && <span className="rr-streak">🔥 {task.streak}</span>}
                {task.dependsOn && <span className="rr-badge" style={{background:'var(--bluebg)', color:'var(--blue)'}}><Link size={10}/> Stacked</span>}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ─── TaskModal ────────────────────────────────────────────────────────────────
    function TaskModal({ task, cats, allTasks, onSave, onClose }) {
      const [name, setName] = useState(task?.name || "");
      const [category, setCategory] = useState(task?.category || cats[0] || "");
      const [shortcut, setShortcut] = useState(task?.frequency || SHORTCUTS[1]);
      const [gracePeriod, setGracePeriod] = useState(task?.gracePeriod || 0);
      const [dependsOn, setDependsOn] = useState(task?.dependsOn || "");
      const [startDate, setStartDate] = useState(task?.nextDueDate || todayStr());

      const handleSave = () => {
        if (!name.trim()) return;
        onSave({ name: name.trim(), category, frequency: shortcut, gracePeriod: Number(gracePeriod), dependsOn, startDate });
      };

      return (
        <>
          <div style={{position:'fixed', inset:0, background:'rgba(0,0,0,0.7)', zIndex:50}} onClick={onClose} />
          <div className="rr-sheet">
            <div style={{padding:'16px'}}>
              <h2 style={{fontSize:20, marginBottom:20}}>Configure Task</h2>
              
              <label style={{fontSize:11, color:'var(--t3)', textTransform:'uppercase'}}>Task Name</label>
              <input value={name} onChange={e=>setName(e.target.value)} style={{width:'100%', padding:12, borderRadius:12, border:'1px solid var(--bd)', background:'var(--s2)', color:'var(--t1)', marginBottom:16}} />

              <label style={{fontSize:11, color:'var(--t3)', textTransform:'uppercase'}}>Stack After (Optional)</label>
              <select value={dependsOn} onChange={e=>setDependsOn(e.target.value)} style={{width:'100%', padding:12, borderRadius:12, border:'1px solid var(--bd)', background:'var(--s2)', color:'var(--t1)', marginBottom:16}}>
                <option value="">None (Independent)</option>
                {allTasks.filter(t=>t.id!==task?.id).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
              </select>

              <label style={{fontSize:11, color:'var(--t3)', textTransform:'uppercase'}}>Grace Period (Snooze)</label>
              <select value={gracePeriod} onChange={e=>setGracePeriod(e.target.value)} style={{width:'100%', padding:12, borderRadius:12, border:'1px solid var(--bd)', background:'var(--s2)', color:'var(--t1)', marginBottom:16}}>
                <option value={0}>Strict (0 days)</option>
                <option value={1}>Forgiving (1 day)</option>
                <option value={3}>Relaxed (3 days)</option>
              </select>

              <div style={{display:'flex', gap:10, marginTop:20}}>
                <button onClick={onClose} style={{flex:1, padding:14, borderRadius:12, border:'1px solid var(--bd)', background:'transparent', color:'var(--t1)'}}>Cancel</button>
                <button onClick={handleSave} style={{flex:1, padding:14, borderRadius:12, border:'none', background:'var(--ac)', color:'#000', fontWeight:'bold'}}>Save</button>
              </div>
            </div>
          </div>
        </>
      );
    }

    // ─── Main App ─────────────────────────────────────────────────────────────────
    function App() {
      const [tasks, setTasks] = useState(() => load(STORAGE_KEY, []));
      const [cats, setCats] = useState(() => load(CATS_KEY, DEFAULT_CATS));
      const [view, setView] = useState("today");
      const [modal, setModal] = useState(null);

      // Auto-animate refs for fluid layout shifts
      const listRefToday = useRef(null);
      const listRefDone = useRef(null);
      
      useEffect(() => { store(STORAGE_KEY, tasks); }, [tasks]);
      useEffect(() => {
        if (listRefToday.current) autoAnimate(listRefToday.current);
        if (listRefDone.current) autoAnimate(listRefDone.current);
      }, [view]);

      // Notifications Request
      const requestPush = async () => {
        if ('Notification' in window) {
          const perm = await Notification.requestPermission();
          if (perm === 'granted') new Notification("Recurr", { body: "Notifications active while app is open!" });
        }
      };

      const handleSaveTask = (data) => {
        if (modal.type === 'edit') {
          setTasks(p => p.map(t => t.id === modal.task.id ? { ...t, ...data } : t));
        } else {
          setTasks(p => [...p, { id: uid(), streak: 0, history: [], lastCompleted: null, ...data }]);
        }
        setModal(null);
      };

      const completeTask = (id) => {
        const tDate = todayStr();
        setTasks(p => p.map(t => {
          if (t.id !== id) return t;
          
          // Calculate Streak logic based on Grace Period
          const expected = new Date(t.nextDueDate + "T12:00:00");
          const completed = new Date();
          const diffDays = Math.floor((completed - expected) / 86400000);
          
          let newStreak = t.streak;
          if (diffDays <= (t.gracePeriod || 0)) newStreak += 1;
          else newStreak = 1; // Missed grace period, restart streak

          const newBase = shiftDate(tDate, t.frequency.value, t.frequency.unit);
          return { ...t, baseDueDate: newBase, nextDueDate: newBase, lastCompleted: tDate, streak: newStreak, history: [...(t.history || []), new Date().toISOString()] };
        }));
      };

      const deleteTask = (id) => setTasks(p => p.filter(t => t.id !== id));

      // View filtering
      const t = todayStr();
      const activeTasks = tasks.filter(task => task.nextDueDate <= t && task.lastCompleted !== t);
      const doneToday = tasks.filter(task => task.lastCompleted === t);
      const historyEntries = tasks.flatMap(t => (t.history || []).map(d => ({ name: t.name, date: new Date(d) }))).sort((a,b) => b.date - a.date);

      return (
        <div className="rr">
          <style>{STYLES}</style>

          <div className="rr-header">
            <div>
              <div className="rr-logo">Recurr</div>
              <div className="rr-header-sub">{new Date().toLocaleDateString('en-US', {weekday:'long', month:'short', day:'numeric'})}</div>
            </div>
            <button onClick={requestPush} style={{background:'none', border:'none', color:'var(--t2)'}}><Bell size={20}/></button>
          </div>

          <div className="rr-content">
            {view === "today" && (
              <div style={{paddingTop: 10}}>
                <div className="rr-sec">To Do</div>
                <div ref={listRefToday}>
                  {activeTasks.length === 0 ? 
                    <div style={{textAlign:'center', padding:40, color:'var(--t3)'}}>All caught up! 🎉</div> :
                    activeTasks.map((task, i) => (
                      <TaskCard key={task.id} task={task} index={i} isCompletedToday={false} onComplete={completeTask} onEdit={t=>setModal({type:'edit', task:t})} onDelete={deleteTask} />
                    ))
                  }
                </div>

                {doneToday.length > 0 && (
                  <>
                    <div className="rr-sec" style={{marginTop: 20}}>Completed Today</div>
                    <div ref={listRefDone}>
                      {doneToday.map((task, i) => (
                        <TaskCard key={task.id} task={task} index={i} isCompletedToday={true} onComplete={()=>{}} onEdit={()=>{}} onDelete={()=>{}} />
                      ))}
                    </div>
                  </>
                )}
              </div>
            )}

            {view === "history" && (
              <div style={{padding: '0 16px', paddingTop:10}}>
                <div className="rr-sec">Recent Completions</div>
                {historyEntries.slice(0, 30).map((h, i) => (
                  <div key={i} className="stagger-item" style={{display:'flex', justifyContent:'space-between', padding:'12px 0', borderBottom:'1px solid var(--bd)', animationDelay:`${i*0.03}s`}}>
                    <span style={{color:'var(--t1)', fontSize:14}}>{h.name}</span>
                    <span style={{color:'var(--t3)', fontSize:12}}>{h.date.toLocaleDateString()}</span>
                  </div>
                ))}
              </div>
            )}
          </div>

          <button className="rr-fab" onClick={() => setModal({type:'add'})}><Plus size={24} color="#000"/></button>

          <nav className="rr-nav">
            <button className={`rr-ntab ${view==="today"?"on":""}`} onClick={()=>setView("today")}><Home size={20}/>Today</button>
            <button className={`rr-ntab ${view==="history"?"on":""}`} onClick={()=>setView("history")}><History size={20}/>History</button>
          </nav>

          {modal && <TaskModal task={modal.task} cats={cats} allTasks={tasks} onSave={handleSaveTask} onClose={()=>setModal(null)} />}
        </div>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
